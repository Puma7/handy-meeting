[package]
name = "handy-meeting-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "HandyMeeting"

[lib]
name = "handy_meeting_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "HandyMeeting"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
handy-bridge = { path = "../../../crates/handy-bridge", features = ["native-asr"] }
meeting-core = { path = "../../../crates/meeting-core" }
meeting-notes = { path = "../../../crates/meeting-notes" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
anyhow = "=1.0.104"
dirs = "=6.0.0"
arboard = { version = "=3.6.1", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
