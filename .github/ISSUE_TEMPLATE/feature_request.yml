name: Feature request
description: Describe a meeting workflow or integration improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: What problem should this solve?}
    validations: {required: true}
  - type: textarea
    id: behavior
    attributes: {label: Desired behavior and a concrete example}
    validations: {required: true}
  - type: textarea
    id: constraints
    attributes: {label: Privacy, recovery and platform constraints}
