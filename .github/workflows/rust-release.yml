name: Build and publish downloads
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on the selected source commit (for example v1.0.0)
        required: true
        type: string
      publish:
        description: Publish the verified draft as Latest (otherwise retain a draft)
        required: true
        default: false
        type: boolean
  pull_request:
    paths: ['.github/workflows/rust-release.yml', '.github/workflows/rust.yml', '.github/workflows/rust-portable.yml', '.github/workflows/windows.yml', 'scripts/ci-plan.py', 'scripts/*release*.py', 'scripts/*installer*', '.github/RELEASE_NOTES.md']
permissions:
  contents: read
concurrency:
  group: downloads-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      already_complete: ${{ steps.existing.outputs.complete }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
      # The release tag is the only version source: every job writes it into the version
      # files right after checkout (scripts/set-version.py), so nothing is bumped by hand.
      - name: Take the version from the release tag and check the exact tag commit
        id: identity
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            version=$(python3 scripts/set-version.py --check)
          else
            version=$(python3 scripts/set-version.py "$REQUESTED_TAG")
          fi
          python3 - "$version" <<'PY'
          import json, os, subprocess, sys
          tag = 'v' + sys.argv[1]
          if os.environ['GITHUB_EVENT_NAME'] != 'pull_request':
              assert os.environ['REQUESTED_TAG'] == tag, 'Release tags look like v1.2.3 or v1.2.3-beta.1'
              commit = json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/commits/'+tag]))['sha']
              assert commit == os.environ['GITHUB_SHA'], 'Select the exact tag commit; artifacts from another source are refused'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag='+tag+'\nversion='+sys.argv[1]+'\n')
          PY
      - name: Verify package, installer and publication boundaries using synthetic data
        run: python3 -m unittest discover -s scripts -p 'test_release*.py'
      - name: Reuse an already complete exact-source release without rebuilding different bytes
        id: existing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .build
          node scripts/rust-artifacts.mjs source-fingerprint > .build/release-source.json
          python3 scripts/publish-rust-release.py --check-existing --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$GITHUB_SHA" --source .build/release-source.json > .build/existing-release.json
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('complete='+str(json.load(open('.build/existing-release.json'))['complete']).lower()+'\n')
          PY
      # Publishing never builds. Publishing a release with a new tag also pushes that tag,
      # and the run of that tag builds and attaches the packages to this release. A run of
      # another tag on the same commit does not count (`branch` is the tag of a tag push).
      - name: Refuse compilation on publication when the prepared bundle is missing
        if: github.event_name == 'release'
        env:
          COMPLETE: ${{ steps.existing.outputs.complete }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$COMPLETE" = true ]; then exit 0; fi
          for attempt in 1 2 3 4 5 6; do
            builds=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rust-release.yml/runs?event=push&branch=$RELEASE_TAG&head_sha=$GITHUB_SHA" --jq '[.workflow_runs[] | select(.conclusion == null or .conclusion == "success")] | length')
            if [ "$builds" -gt 0 ]; then
              echo '::notice::The tag build of this commit attaches the packages to this release; nothing is built here.'
              exit 0
            fi
            sleep 10
          done
          echo '::error::Publication requires a complete exact-source draft or a tag build of the same commit. Wait for the tag build, or recover its retained verified-release-bundle with Re-run failed jobs. Publishing never starts another build or replaces assets.'
          exit 1
  windows:
    needs: validate
    if: github.event_name != 'pull_request' && github.event_name != 'release' && needs.validate.outputs.already_complete != 'true'
    uses: ./.github/workflows/rust.yml
    with:
      packages: true
      version: ${{ needs.validate.outputs.version }}
  portable:
    needs: validate
    if: github.event_name != 'pull_request' && github.event_name != 'release' && needs.validate.outputs.already_complete != 'true'
    uses: ./.github/workflows/rust-portable.yml
    with:
      packages: true
      version: ${{ needs.validate.outputs.version }}
  publish:
    needs: [validate, windows, portable]
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
      - name: Use the version of the release tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/set-version.py "$VERSION"
      - name: Download only this successful run's platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .build/release-inputs
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-windows-beta-candidate -D .build/release-inputs/windows
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-windows-checks -D .build/release-inputs/windows-checks
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-desktop-linux-x64 -D .build/release-inputs/linux
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-portable-checks-linux-x64 -D .build/release-inputs/linux-checks
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-desktop-osx-arm64 -D .build/release-inputs/mac-arm64
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-portable-checks-osx-arm64 -D .build/release-inputs/mac-arm64-checks
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-desktop-osx-x64 -D .build/release-inputs/mac-x64
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n rust-portable-checks-osx-x64 -D .build/release-inputs/mac-x64-checks
      - name: Verify every package, native store and exact-source proof before uploading anything
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/rust-artifacts.mjs source-fingerprint > .build/release-source.json
          python3 scripts/release-packages.py --artifacts .build/release-inputs --version "$VERSION" --commit "$GITHUB_SHA" --source .build/release-source.json --output .build/release-bundle
      - name: Retain the complete verified bundle before any publication attempt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-bundle
          path: .build/release-bundle/*
          if-no-files-found: error
          retention-days: 30
      - name: Attach complete verified packages without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$PUBLISH_RELEASE" = true ]]; then args+=(--publish); fi
          python3 scripts/publish-rust-release.py --folder .build/release-bundle --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$GITHUB_SHA" --notes .github/RELEASE_NOTES.md "${args[@]}"
  publish_existing:
    needs: validate
    if: needs.validate.outputs.already_complete == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
      - name: Use the version of the release tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/set-version.py "$VERSION"
      - name: Publish the already verified complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .build
          node scripts/rust-artifacts.mjs source-fingerprint > .build/release-source.json
          python3 scripts/publish-rust-release.py --check-existing --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$GITHUB_SHA" --source .build/release-source.json > .build/existing-release.json
          python3 -c 'import json; assert json.load(open(".build/existing-release.json"))["complete"] is True, "Complete exact-source release required immediately before promotion"'
          if [[ "$TAG" = *-* ]]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
