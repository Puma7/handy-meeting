name: Windows checks
on:
  pull_request:
  workflow_dispatch:
# Keep the existing required verify context. No branch/tag push duplicate.
permissions:
  contents: read
concurrency:
  group: legacy-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build and verify without models or cloud credentials
        shell: pwsh
        run: ./verify.ps1
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-checks
          path: |
            .build/verification-*/pcm/**
            .build/verification-*/notes/**
            .build/verification-*/templates/**
            .build/verification-*/agent/**
            .build/verification-*/monitor/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
