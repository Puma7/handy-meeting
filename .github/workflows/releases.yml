name: Publish prototype downloads
on:
  workflow_dispatch:
    inputs:
      portable_run_id:
        description: Successful portable.yml run on this exact commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          ./verify.ps1
          ./build.ps1
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-prototype
          path: packages/HandyMeeting-0.4.1-windows-x64.zip*
  publish:
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify trusted portable artifacts and publish prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_RUN_ID: ${{ inputs.portable_run_id }}
        run: |
          set -euo pipefail
          [[ "$PORTABLE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PORTABLE_RUN_ID" > .build-portable-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('.build-portable-run.json'))
          assert run['head_sha'] == os.environ['GITHUB_SHA'], 'Artifact commit mismatch'
          assert run['conclusion'] == 'success', 'Portable validation did not pass'
          assert run['event'] == 'workflow_dispatch', 'Unexpected workflow event'
          assert run['path'] == '.github/workflows/portable.yml', 'Unexpected workflow'
          PY
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n windows-prototype -D .build-release/windows
          gh run download "$PORTABLE_RUN_ID" -R "$GITHUB_REPOSITORY" -n mac-preview-arm64 -D .build-release/mac-arm64
          gh run download "$PORTABLE_RUN_ID" -R "$GITHUB_REPOSITORY" -n mac-preview-x64 -D .build-release/mac-x64
          gh run download "$PORTABLE_RUN_ID" -R "$GITHUB_REPOSITORY" -n linux-preview -D .build-release/linux
          mkdir -p .build-release/portable
          find .build-release/mac-arm64 .build-release/mac-x64 -type f -name '*.dmg' -exec cp {} .build-release/portable/ \;
          find .build-release/linux -type f -name '*.deb' -exec cp {} .build-release/portable/ \;
          test "$(find .build-release/portable -type f | wc -l)" -eq 3
          (cd .build-release/portable && sha256sum *.dmg *.deb > SHA256SUMS.txt)
          for tag in v0.4.1 v0.5.0-preview.1; do
            if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft > .build-release/state.json 2>/dev/null; then
              notes='.github/RELEASE_NOTES_WINDOWS.md'
              title='Windows prototype 0.4.1'
              if [[ "$tag" == v0.5.0-preview.1 ]]; then notes='.github/RELEASE_NOTES_PORTABLE.md'; title='Portable preview 0.5.0-preview.1'; fi
              gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "$title" --notes-file "$notes"
              echo '{"isDraft":true}' > .build-release/state.json
            fi
            if python3 -c "import json,sys;sys.exit(0 if json.load(open('.build-release/state.json'))['isDraft'] else 1)"; then
              if [[ "$tag" == v0.4.1 ]]; then
                gh release upload "$tag" -R "$GITHUB_REPOSITORY" .build-release/windows/*.zip .build-release/windows/*.sha256 --clobber
                gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file .github/RELEASE_NOTES_WINDOWS.md --target "$GITHUB_SHA" --draft=false --prerelease
              else
                gh release upload "$tag" -R "$GITHUB_REPOSITORY" .build-release/portable/* --clobber
                gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
              fi
            else
              echo "$tag already published; preserving existing assets."
            fi
          done
